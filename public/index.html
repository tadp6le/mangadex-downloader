<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MangaDex Downloader</title>

<style>
body {
  background: #0b0f19;
  color: white;
  font-family: Arial;
  margin: 0;
  display: flex;
  justify-content: center;
}

.container {
  width: 600px;
  padding: 20px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin-bottom: 10px;
  background: #1a2233;
  color: white;
}

button {
  padding: 10px 15px;
  border-radius: 8px;
  border: none;
  background: orange;
  cursor: pointer;
}

table {
  width: 100%;
  margin-top: 15px;
}

td {
  padding: 6px;
}

img {
  width: 200px;
  border-radius: 10px;
  margin: 10px 0;
}
</style>

</head>
<body>

<div class="container">

<h2>MangaDex Downloader</h2>

<form id="searchForm">
  <input id="urlInput" placeholder="Paste MangaDex URL (full link)" />
</form>

<!-- custom name -->
<input id="customName" placeholder="Enter file name (e.g. girl)" />

<!-- cover -->
<img id="coverImage" style="display:none;" />

<h3 id="mangaTitle"></h3>

<button id="downloadSelectedBtn">Download Selected (Merged)</button>

<table>
<thead>
<tr>
<th><input type="checkbox" id="checkAll"></th>
<th>Chapter</th>
<th>Action</th>
</tr>
</thead>
<tbody id="chaptersBody"></tbody>
</table>

</div>

<script src="script.js"></script>

</body>
  </html>
